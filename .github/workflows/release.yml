name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g. v0.1.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run tests with race detection
        run: go test -v -race ./...

      - name: Determine version
        id: version
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          echo "tag=$RAW_TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for version: $VERSION (tag: $RAW_TAG)"

      - name: Compile multi-platform binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GOOGLE_CLIENT_ID: ${{ secrets.CASTOR_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.CASTOR_GOOGLE_CLIENT_SECRET }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/ostamand/castor/internal/cli.version=${VERSION} -X github.com/ostamand/castor/internal/auth.defaultClientID=${GOOGLE_CLIENT_ID} -X github.com/ostamand/castor/internal/auth.defaultClientSecret=${GOOGLE_CLIENT_SECRET}"

          echo "Compiling linux/amd64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/castor-linux-amd64 ./cmd/castor

          echo "Compiling linux/arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/castor-linux-arm64 ./cmd/castor

          echo "Compiling darwin/arm64 (macOS Apple Silicon)..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/castor-darwin-arm64 ./cmd/castor

          echo "Compiling darwin/amd64 (macOS Intel)..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/castor-darwin-amd64 ./cmd/castor

      - name: Generate SHA-256 Checksums
        run: |
          cd dist
          sha256sum castor-* > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Castor ${{ steps.version.outputs.tag }}"
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
