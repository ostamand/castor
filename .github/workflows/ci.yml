name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Go Vet
        run: go vet ./...

      - name: Run tests with race detection
        run: go test -v -race ./...

      - name: Build local binary
        run: go build -ldflags="-s -w" -o bin/castor ./cmd/castor
